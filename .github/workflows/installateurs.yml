# Fabrique automatiquement les installateurs Windows, macOS et Linux
# (onglet « Actions » du dépôt GitHub > « Installateurs » > « Run workflow »).
name: Installateurs
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Préparer le mot de passe d'installation
        env:
          AE_INSTALL_PASSWORD: ${{ secrets.AE_INSTALL_PASSWORD }}
        run: node tools/prepare-build.mjs
      - name: Installer les dépendances
        working-directory: electron
        run: npm install
      - name: Construire
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: installateurs-${{ matrix.os }}
          path: |
            electron/dist/*.exe
            electron/dist/*.dmg
            electron/dist/*.AppImage
            electron/dist/*.deb
