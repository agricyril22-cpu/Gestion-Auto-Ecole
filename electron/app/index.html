<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestion Auto-École</title>
<meta name="description" content="Gestion complète d'auto-école : inscriptions, paiements, planning, examens, moniteurs, véhicules, finances et code de la route.">
<meta name="theme-color" content="#2b3038">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Auto-École">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font-size: 14px; }
img { max-width: 100%; }
[hidden] { display: none !important; }

/* Layout : bande "asphalte" à gauche (navigation, ligne médiane jaune), zone de travail claire à droite ; sur téléphone la bande passe en haut. */
:root {
  --bg: #eef1f4; --surface: #ffffff; --surface-2: #f4f6f9; --ink: #18212c; --muted: #5a6778; --line: #d5dce5;
  --accent: #1d5bbf; --accent-soft: #e3ecfa; --accent-ink: #ffffff;
  --road: #2b3038; --road-ink: #e6eaef; --road-muted: #9aa4b1; --mark: #f2b705;
  --ok: #1d7f46; --ok-bg: #e2f3e9; --warn: #a35f00; --warn-bg: #fbefd9; --bad: #b70f29; --bad-bg: #fbe4e7;
  --sign-tile: #f4f6f9;
  --f-display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --f-body: "Barlow", "Segoe UI", Roboto, Arial, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12161b; --surface: #1a2028; --surface-2: #212833; --ink: #e6ebf1; --muted: #98a4b3; --line: #2f3946;
  --accent: #6a9ff2; --accent-soft: #1f2e48; --accent-ink: #0d1420;
  --road: #0b0e12; --road-ink: #e6eaef; --road-muted: #8792a0; --mark: #f2b705;
  --ok: #4cc983; --ok-bg: #173226; --warn: #f0ae4a; --warn-bg: #3a2b14; --bad: #ff6b7c; --bad-bg: #3d1a20;
  --sign-tile: #2a323d; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #12161b; --surface: #1a2028; --surface-2: #212833; --ink: #e6ebf1; --muted: #98a4b3; --line: #2f3946;
  --accent: #6a9ff2; --accent-soft: #1f2e48; --accent-ink: #0d1420;
  --road: #0b0e12; --road-ink: #e6eaef; --road-muted: #8792a0; --mark: #f2b705;
  --ok: #4cc983; --ok-bg: #173226; --warn: #f0ae4a; --warn-bg: #3a2b14; --bad: #ff6b7c; --bad-bg: #3d1a20;
  --sign-tile: #2a323d; color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
* { box-sizing: border-box; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; line-height: 1.1; margin: 0; text-wrap: balance; letter-spacing: .01em; }
h1 { font-size: 2.1rem; } h2 { font-size: 1.5rem; } h3 { font-size: 1.15rem; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--mark); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--road); color: var(--road-ink); position: sticky; top: 0; height: 100vh; overflow-y: auto;
  display: flex; flex-direction: column; gap: 18px; padding: 22px 0 22px 0;
  background-image: repeating-linear-gradient(to bottom, var(--mark) 0 26px, transparent 26px 46px);
  background-size: 4px 100%; background-repeat: no-repeat; background-position: right 10px top; }
.brand { padding: 0 26px 0 20px; display: grid; gap: 4px; }
.brand small { color: var(--road-muted); font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; }
.brand strong { font-family: var(--f-display); font-size: 1.45rem; line-height: 1.05; }
.nav { display: flex; flex-direction: column; gap: 2px; padding: 0 22px 0 10px; }
.nav a { color: var(--road-ink); text-decoration: none; padding: 8px 12px; border-radius: 8px; font-weight: 500; display: flex; align-items: center; gap: 10px; }
.nav a::before { content: ""; width: 14px; height: 4px; border-radius: 2px; background: transparent; flex: none; }
.nav a:hover { background: rgba(255,255,255,.06); }
.nav a[aria-current="page"] { background: rgba(255,255,255,.1); }
.nav a[aria-current="page"]::before { background: var(--mark); }
.nav .sep { font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; color: var(--road-muted); padding: 14px 12px 4px 36px; }
.side .foot { margin-top: auto; padding: 0 26px 0 20px; color: var(--road-muted); font-size: .8rem; }

.main { padding: 28px 32px 60px; display: grid; gap: 22px; align-content: start; min-width: 0; }
.head { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: end; justify-content: space-between; }
.head .sub { color: var(--muted); margin-top: 4px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.banner { background: var(--warn-bg); color: var(--warn); border-radius: var(--r); padding: 10px 14px; font-weight: 500; }

.btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 9px 16px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.ghost:hover { background: var(--surface-2); filter: none; }
.btn.sm { padding: 5px 11px; font-size: .88rem; }
.btn.danger { background: var(--bad); color: #fff; }
.btn.link { background: none; color: var(--accent); padding: 0; border: 0; font-weight: 600; }
.icon { background: none; border: 0; font-size: 1.6rem; line-height: 1; cursor: pointer; color: var(--muted); padding: 2px 8px; border-radius: 6px; }
.icon:hover { background: var(--surface-2); }
body.ro .w { display: none !important; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.card > h3 { margin-bottom: 12px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 2px; }
.kpi span { color: var(--muted); font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; }
.kpi b { font-family: var(--f-display); font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.kpi small { color: var(--muted); }

.list { display: grid; gap: 0; }
.li { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 10px 0; border-top: 1px solid var(--line); min-width: 0; }
.li:first-child { border-top: 0; }
.li .t { min-width: 0; }
.li .t b { display: block; overflow-wrap: anywhere; }
.li .t small { color: var(--muted); }
.empty { color: var(--muted); padding: 8px 0; }
.date-chip { font-family: var(--f-display); text-align: center; background: var(--surface-2); border-radius: 8px; padding: 4px 8px; min-width: 54px; line-height: 1.05; flex: none; }
.date-chip b { display: block; font-size: 1.4rem; }
.date-chip small { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }

.pill { display: inline-block; font-size: .78rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.acc { background: var(--accent-soft); color: var(--accent); }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.ex { background: transparent; border: 1px dashed var(--line); color: var(--muted); font-weight: 500; }
.catbadge { font-family: var(--f-display); font-weight: 800; background: var(--ink); color: var(--bg); border-radius: 6px; padding: 1px 7px; font-size: .9rem; letter-spacing: .03em; }

.filters { display: flex; flex-wrap: wrap; gap: 10px; }
.filters input, .filters select { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.filters input { flex: 1 1 220px; }

.tw { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
table { border-collapse: collapse; width: 100%; min-width: 720px; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--surface-2); }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--surface-2); }
tbody tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }

.bar { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; min-width: 70px; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.bar.ok i { background: var(--ok); }

/* Planning */
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; display: grid; gap: 8px; align-content: start; min-height: 120px; min-width: 0; }
.day.today { border-color: var(--accent); box-shadow: inset 0 3px 0 var(--accent); }
.day h4 { margin: 0; font-family: var(--f-display); font-size: 1.05rem; display: flex; justify-content: space-between; gap: 6px; }
.day h4 small { color: var(--muted); font-weight: 500; }
.sess { border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 7px; padding: 6px 8px; background: var(--surface-2); cursor: pointer; font-size: .86rem; display: grid; gap: 1px; min-width: 0; }
.sess.code { border-left-color: var(--mark); }
.sess.effectuee { opacity: .72; }
.sess.annulee { opacity: .5; text-decoration: line-through; }
.sess b { overflow-wrap: anywhere; }
.sess small { color: var(--muted); overflow-wrap: anywhere; }

/* Examens & catégories */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 14px; }
.xcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; cursor: pointer; align-content: start; }
.xcard:hover { border-color: var(--accent); }
.xcard .top { display: flex; gap: 12px; align-items: center; }
.xcard .meta { color: var(--muted); font-size: .9rem; }
.tabs { display: flex; gap: 4px; background: var(--surface-2); border-radius: 9px; padding: 4px; width: fit-content; max-width: 100%; overflow-x: auto; }
.tabs button { border: 0; background: transparent; padding: 6px 14px; border-radius: 7px; cursor: pointer; font-weight: 600; color: var(--muted); white-space: nowrap; }
.tabs button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.catcode { font-family: var(--f-display); font-weight: 800; font-size: 2.2rem; line-height: 1; background: var(--ink); color: var(--bg); border-radius: 8px; padding: 6px 10px; min-width: 64px; text-align: center; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.facts div { background: var(--surface-2); border-radius: 8px; padding: 6px 8px; }
.facts span { display: block; font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.facts b { font-variant-numeric: tabular-nums; }

/* Code de la route */
.lessons { display: grid; gap: 10px; }
details.lesson { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
details.lesson summary { cursor: pointer; padding: 14px 18px; font-family: var(--f-display); font-size: 1.2rem; font-weight: 700; list-style: none; display: flex; justify-content: space-between; gap: 12px; }
details.lesson summary::-webkit-details-marker { display: none; }
details.lesson summary::after { content: "+"; color: var(--muted); font-size: 1.4rem; line-height: 1; }
details.lesson[open] summary::after { content: "–"; }
details.lesson .body { padding: 0 18px 18px; max-width: 72ch; display: grid; gap: 10px; }
.body ul, .body ol { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.body table { min-width: 0; }
.hier { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; counter-reset: h; }
.hier div { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; counter-increment: h; }
.hier div::before { content: counter(h); font-family: var(--f-display); font-weight: 800; font-size: 1.5rem; color: var(--accent); display: block; line-height: 1; }
.note { color: var(--muted); font-size: .88rem; }

/* Panneaux */
.signs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 12px; }
.sign { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 8px; align-content: start; }
.sign .pic { background: var(--sign-tile); border-radius: 8px; display: grid; place-items: center; padding: 14px; }
.sign svg { width: 96px; height: 96px; }
.sign b { font-family: var(--f-display); font-size: 1.08rem; line-height: 1.15; }
.sign p { color: var(--muted); font-size: .88rem; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 999px; cursor: pointer; font-weight: 500; }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.famintro { color: var(--muted); max-width: 75ch; }

/* Quiz */
.quiz { max-width: 720px; display: grid; gap: 16px; }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; display: grid; gap: 16px; }
.qcard .pic { display: grid; place-items: center; background: var(--sign-tile); border-radius: 10px; padding: 18px; }
.qcard .pic svg { width: 140px; height: 140px; }
.qprog { display: flex; gap: 4px; }
.qprog i { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-2); }
.qprog i.ok { background: var(--ok); } .qprog i.ko { background: var(--bad); } .qprog i.cur { background: var(--accent); }
.choices { display: grid; gap: 8px; }
.choices button { text-align: left; border: 1px solid var(--line); background: var(--surface-2); border-radius: 9px; padding: 11px 14px; cursor: pointer; font-weight: 500; display: flex; gap: 10px; align-items: baseline; }
.choices button:hover:not(:disabled) { border-color: var(--accent); }
.choices button:disabled { cursor: default; }
.choices button .k { font-family: var(--f-display); font-weight: 800; color: var(--muted); }
.choices button.good { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.choices button.bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.expl { background: var(--surface-2); border-radius: 8px; padding: 10px 14px; }
.score { font-family: var(--f-display); font-size: 3.4rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }

/* Formulaires / dialog */
dialog { border: 0; border-radius: 14px; padding: 0; width: min(680px, calc(100% - 24px)); max-height: calc(100% - 24px); background: var(--surface); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.35); }
dialog::backdrop { background: rgba(10, 14, 20, .55); }
.dbody { padding: 20px 22px 22px; display: grid; gap: 16px; }
.dh { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
.df { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
.form { display: grid; gap: 14px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 12px; }
.f { display: grid; gap: 4px; min-width: 0; }
.f > span { font-size: .8rem; font-weight: 600; color: var(--muted); }
.f input, .f select, .f textarea { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0; }
.f textarea { min-height: 70px; resize: vertical; }
.checks { display: grid; gap: 2px; max-height: 220px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: var(--surface-2); }
.checks label { display: flex; gap: 8px; align-items: center; padding: 4px 0; }
.warn-t { color: var(--warn); font-weight: 500; }
.info { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); gap: 10px 18px; }
.info div span { display: block; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
.info div b { font-weight: 600; overflow-wrap: anywhere; }
.sect { display: grid; gap: 8px; }
.sect h3 { font-size: 1.05rem; }
.payrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)) auto; gap: 8px; align-items: end; }
.res-sel { background: var(--surface-2); border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 9px; font-weight: 500; z-index: 50; max-width: calc(100% - 32px); }

@media (max-width: 1100px) { .week { grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); } }
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; height: auto; flex-direction: row; align-items: center; gap: 10px; padding: 10px 0;
    background-image: repeating-linear-gradient(to right, var(--mark) 0 26px, transparent 26px 46px); background-size: 100% 3px; background-position: left bottom 3px; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--road); }
  .brand { padding: 0 0 0 16px; flex: none; }
  .brand small { display: none; }
  .brand strong { font-size: 1.1rem; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav { flex-direction: row; overflow-x: auto; padding: 0 16px 6px 0; scrollbar-width: none; }
  .nav a { white-space: nowrap; padding: 6px 10px; }
  .nav a::before { display: none; }
  .nav a[aria-current="page"] { box-shadow: inset 0 -3px 0 var(--mark); border-radius: 6px 6px 0 0; }
  .nav .sep, .side .foot { display: none; }
  .main { padding: 20px 16px 60px; }
  h1 { font-size: 1.7rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ===== Ajouts version Pro ===== */
.side .foot { display: grid; gap: 8px; }
.side .foot .btn { justify-self: start; }
.alerts { display: grid; gap: 8px; }
.alert { display: flex; gap: 12px; align-items: center; justify-content: space-between; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--warn); border-radius: 8px; padding: 9px 12px; min-width: 0; }
.alert.bad { border-left-color: var(--bad); }
.alert.info { border-left-color: var(--accent); }
.alert span { min-width: 0; overflow-wrap: anywhere; }
.avatar { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; background: var(--surface-2); display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 1.5rem; color: var(--muted); flex: none; overflow: hidden; }
.avatar.sm { width: 34px; height: 34px; font-size: .9rem; border-radius: 7px; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.who { display: flex; gap: 10px; align-items: center; min-width: 0; }
.livret { display: grid; gap: 12px; }
.livret h4 { margin: 0 0 4px; font-family: var(--f-display); font-size: 1rem; }
.comp { display: flex; gap: 10px; justify-content: space-between; align-items: center; padding: 5px 0; border-top: 1px dashed var(--line); }
.comp select { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; font-size: .86rem; }
.lv0 { color: var(--muted); } .lv1 { color: var(--warn); } .lv2 { color: var(--accent); } .lv3 { color: var(--ok); }
.docs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 4px 14px; }
.docs label { display: flex; gap: 8px; align-items: center; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--f-body); }
.chart .grid line { stroke: var(--line); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: .85rem; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.hbar { display: grid; grid-template-columns: 60px minmax(0, 1fr) 70px; gap: 10px; align-items: center; padding: 4px 0; }
.hbar .bar { height: 12px; }
.timer { font-family: var(--f-display); font-size: 1.4rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.timer.low { color: var(--bad); }
.lock { position: fixed; inset: 0; z-index: 100; background: var(--road); color: var(--road-ink); display: grid; place-items: center; padding: 24px; }
.lock form { display: grid; gap: 14px; width: min(340px, 100%); text-align: center; }
.lock input { font-size: 1.6rem; text-align: center; letter-spacing: .4em; padding: 10px; border-radius: 10px; border: 0; background: rgba(255,255,255,.1); color: var(--road-ink); }
.conflict { color: var(--bad); font-weight: 600; }
.sess.conf { border-color: var(--bad); }
.section-title { font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.logo-prev { max-height: 60px; max-width: 160px; border-radius: 6px; background: var(--surface-2); }
.steps { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
#print { display: none; }
@media print {
  @page { size: A4; margin: 14mm; }
  body { background: #fff !important; color: #000 !important; }
  .app, dialog, .toast, .lock { display: none !important; }
  #print { display: block !important; font-family: var(--f-body); color: #000; font-size: 12pt; }
}
.doc { color: #000; background: #fff; font-family: "Barlow", Arial, sans-serif; font-size: 12pt; line-height: 1.45; }
.doc .dhd { display: flex; justify-content: space-between; gap: 20px; align-items: flex-start; border-bottom: 3px solid #1d5bbf; padding-bottom: 10px; margin-bottom: 18px; }
.doc .dhd img { max-height: 70px; max-width: 180px; }
.doc h1 { font-family: "Barlow Condensed", Arial, sans-serif; font-size: 22pt; margin: 0 0 6px; color: #000; }
.doc h2 { font-family: "Barlow Condensed", Arial, sans-serif; font-size: 15pt; margin: 18px 0 8px; color: #000; }
.doc table { width: 100%; min-width: 0; border-collapse: collapse; margin: 8px 0; }
.doc th, .doc td { border: 1px solid #999; padding: 6px 8px; text-align: left; color: #000; background: #fff; }
.doc th { background: #eef2f8; text-transform: none; letter-spacing: 0; font-size: 10pt; }
.doc .small { font-size: 9.5pt; color: #444; }
.doc .sign { display: flex; justify-content: space-between; gap: 40px; margin-top: 40px; }
.doc .sign div { flex: 1; border-top: 1px solid #000; padding-top: 6px; font-size: 10pt; }
.doc .big { font-size: 18pt; font-weight: 700; }
.doc .stamp { border: 2px solid #1d5bbf; color: #1d5bbf; display: inline-block; padding: 4px 10px; border-radius: 6px; font-weight: 700; transform: rotate(-4deg); }
.choices button.sel { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.dtabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.dtabs button { border: 0; background: none; padding: 8px 12px; cursor: pointer; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
.dtabs button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--mark); }

@media (max-width: 820px) { .side .foot { display: none !important; } }

const CATS_DEFAUT = [
  { code: 'AM', libelle: 'Cyclomoteurs', description: 'Cyclomoteurs à deux ou trois roues (cylindrée ≤ 50 cm³, vitesse ≤ 45 km/h) et quadricycles légers.', ageMin: 14, heuresCode: 10, heuresConduite: 8, tarif: 0, ordre: 1 },

/* ============ Panneaux (SVG) ============ */

const tri = i => `<path d="M50 8 L94 86 H6 Z" fill="${WH}" stroke="${RED}" stroke-width="8" stroke-linejoin="round"/>${i}`;

const turnR = c => `<path d="M36 84 V54 Q36 40 50 40 H56 V28 L76 46 L56 64 V54 H50 V84 Z" fill="${c}"/>`;
const mirror = s => `<g transform="matrix(-1 0 0 1 100 0)">${s}</g>`;
const walker = (c, x = 0, y = 0, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})" stroke="${c}" stroke-width="5" stroke-linecap="round" fill="none"><circle cx="52" cy="38" r="5" fill="${c}" stroke="none"/><path d="M51 46 L46 63 L39 80 M46 63 L56 80 M50 51 L40 59 M50 51 L60 58"/></g>`;
const bike = (c, sw = 3.5) => `<g fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"><circle cx="34" cy="62" r="11"/><circle cx="66" cy="62" r="11"/><path d="M34 62 L44 46 H60 L66 62 M44 46 L52 62 L60 46 M40 41 H48 M58 40 L62 40"/></g>`;

const vArrow = (x, c, up, w = 8) => up

const giratoire = () => [0, 120, 240].map(r => `<g transform="rotate(${r} 50 50)"><path d="M58 25 A26 26 0 0 0 28 36" fill="none" stroke="${WH}" stroke-width="8"/><path d="M18 30 L36 30 L26 46 Z" fill="${WH}"/></g>`).join('');
const autorouteSym = `<path d="M30 88 L45 52 H55 L70 88 Z" fill="${WH}"/><path d="M50 84 V76 M50 70 V63 M50 58 V54" stroke="${BLU}" stroke-width="2.5"/><path d="M14 40 Q50 22 86 40 V49 Q50 31 14 49 Z" fill="${WH}"/>`;

const SIGNS = [
  // Danger
  { f: 'danger', n: 'Virage à droite', s: 'Annonce un virage dangereux vers la droite. Réduisez votre vitesse avant d’entrer dans le virage.', g: tri(`<path d="M44 80 V66 Q44 54 56 52" fill="none" stroke="${K}" stroke-width="6"/><path d="M54 43 L67 52 L54 61 Z" fill="${K}"/>`) },
  { f: 'danger', n: 'Virage à gauche', s: 'Annonce un virage dangereux vers la gauche. Ralentissez et gardez votre droite.', g: tri(mirror(`<path d="M44 80 V66 Q44 54 56 52" fill="none" stroke="${K}" stroke-width="6"/><path d="M54 43 L67 52 L54 61 Z" fill="${K}"/>`)) },
  { f: 'danger', n: 'Succession de virages', s: 'Plusieurs virages se suivent, le premier dans le sens indiqué. Adaptez votre vitesse sur toute la section.', g: tri(`<path d="M44 82 V72 Q44 64 54 60 Q62 56 56 47" fill="none" stroke="${K}" stroke-width="6"/><path d="M47 48 L53 35 L63 46 Z" fill="${K}"/>`) },
  { f: 'danger', n: 'Chaussée rétrécie', s: 'La largeur de la route diminue. Serrez à droite et méfiez-vous des véhicules en sens inverse.', g: tri(`<path d="M37 82 L43 62 V42 M63 82 L57 62 V42" fill="none" stroke="${K}" stroke-width="6"/>`) },
  { f: 'danger', n: 'Intersection avec priorité à droite', s: 'Carrefour où vous devez céder le passage aux véhicules venant de votre droite.', g: tri(`<path d="M38 44 L62 80 M62 44 L38 80" stroke="${K}" stroke-width="7" stroke-linecap="round"/>`) },
  { f: 'danger', n: 'Cassis ou dos-d’âne', s: 'Ralentisseur ou bosse sur la chaussée. Ralentissez pour garder le contrôle du véhicule.', g: tri(`<path d="M24 78 H36 Q50 52 64 78 H76 V80 H24 Z" fill="${K}"/>`) },

  { f: 'danger', n: 'Feux tricolores', s: 'Annonce une intersection réglée par des feux de signalisation.', g: tri(`<rect x="41" y="34" width="18" height="48" rx="4" fill="${K}"/><circle cx="50" cy="44" r="5.5" fill="${RED}"/><circle cx="50" cy="58" r="5.5" fill="${YEL}"/><circle cx="50" cy="72" r="5.5" fill="#1f9d55"/>`) },

  { f: 'danger', n: 'Passage à niveau avec barrières', s: 'Croisement avec une voie ferrée équipée de barrières. Ne vous engagez jamais si les barrières bougent ou si le feu clignote.', g: tri(`<g stroke="${K}" stroke-width="4"><path d="M30 56 H70 M30 68 H70"/><path d="M35 50 V80 M50 50 V80 M65 50 V80"/></g>`) },

  { f: 'interdiction', n: 'Circulation interdite à tout véhicule', s: 'Aucun véhicule ne peut circuler sur cette voie, dans les deux sens.', g: ronR('') },
  { f: 'interdiction', n: 'Vitesse limitée à 30 km/h', s: 'Vitesse maximale autorisée : 30 km/h, jusqu’au panneau de fin ou à la prochaine intersection.', g: ronR(T('30', 40)) },
  { f: 'interdiction', n: 'Vitesse limitée à 50 km/h', s: 'Vitesse maximale autorisée : 50 km/h.', g: ronR(T('50', 40)) },

  { f: 'interdiction', n: 'Hauteur limitée', s: 'Accès interdit aux véhicules dont la hauteur (chargement compris) dépasse la valeur indiquée.', g: ronR(`<path d="M42 22 H58 L50 31 Z M42 78 H58 L50 69 Z" fill="${K}"/>` + T('3,5 m', 24, K, 59)) },

  { f: 'interdiction', n: 'Arrêt et stationnement interdits', s: 'Ni arrêt ni stationnement, même quelques instants.', g: ronBR(`<path d="M21 21 L79 79 M79 21 L21 79" stroke="${RED}" stroke-width="9"/>`) },
  { f: 'interdiction', n: 'Fin de limitation de vitesse', s: 'Fin de la limitation indiquée ; la vitesse générale de la route s’applique de nouveau.', g: finR(T('50', 38, '#888')) },

  { f: 'obligation', n: 'Direction obligatoire à droite', s: 'Obligation de tourner à droite à la prochaine intersection.', g: ronB(`<g transform="translate(50 50) scale(.82) translate(-56 -56)">${turnR(WH)}</g>`) },
  { f: 'obligation', n: 'Direction obligatoire à gauche', s: 'Obligation de tourner à gauche à la prochaine intersection.', g: ronB(mirror(`<g transform="translate(50 50) scale(.82) translate(-56 -56)">${turnR(WH)}</g>`)) },

const LECONS = [
  { t: 'Documents et équipements obligatoires', h: `<p>Le conducteur doit pouvoir présenter à tout contrôle :</p><ul><li>son <b>permis de conduire</b> valide pour la catégorie du véhicule ;</li><li>la <b>carte grise</b> (certificat d’immatriculation) ;</li><li>l’<b>attestation d’assurance</b> en cours de validité ;</li><li>le certificat de <b>visite technique</b> lorsque le véhicule y est soumis.</li></ul><p>Équipements : triangle de présignalisation, gilet de haute visibilité, roue de secours ou kit anti-crevaison, trousse de secours ; extincteur exigé dans certains pays et pour les véhicules de transport.</p>` },
  { t: 'Les règles de priorité', h: `<ul><li>En l’absence de signalisation, la règle est la <b>priorité à droite</b>.</li><li><b>STOP</b> : arrêt complet à la ligne, même sans circulation, puis céder le passage dans toutes les directions.</li><li><b>Cédez le passage</b> : ralentir, s’arrêter seulement si nécessaire et laisser passer.</li><li><b>Carrefour giratoire</b> annoncé par « cédez le passage » : priorité aux véhicules déjà engagés dans l’anneau.</li><li><b>Véhicules prioritaires</b> (pompiers, ambulance, police) avec sirène et gyrophare : faciliter leur passage, sans danger pour les autres.</li><li>Les <b>piétons</b> engagés sur un passage ont toujours la priorité.</li></ul>` },
  { t: 'Hiérarchie des indications', h: `<p>Quand plusieurs indications se contredisent, on obéit dans cet ordre :</p><div class="hier"><div>Les gestes de l’agent de circulation</div><div>Les feux de signalisation</div><div>Les panneaux</div><div>Le marquage au sol</div><div>Les règles générales (priorité à droite)</div></div>` },
  { t: 'Vitesse, distances de sécurité et d’arrêt', h: `<ul><li><b>Distance de sécurité</b> : au moins <b>2 secondes</b> avec le véhicule qui précède (davantage par pluie, nuit ou brouillard). Repère : 2 traits de la bande d’arrêt d’urgence sur autoroute.</li><li><b>Distance d’arrêt = distance de réaction + distance de freinage.</b></li><li>Le temps de réaction moyen est d’environ <b>1 seconde</b> ; il augmente avec la fatigue, l’alcool, le téléphone.</li><li>Repère pratique sur route sèche : distance d’arrêt ≈ (dizaine de la vitesse)² en mètres. À 50 km/h ≈ 25 m, à 90 km/h ≈ 81 m. Sur route mouillée, comptez environ 1,5 fois plus.</li></ul><table><thead><tr><th>Vitesse</th><th class="r">Parcouru en 1 s</th><th class="r">Arrêt (sec)</th><th class="r">Arrêt (mouillé)</th></tr></thead><tbody><tr><td>50 km/h</td><td class="r num">14 m</td><td class="r num">≈ 25 m</td><td class="r num">≈ 38 m</td></tr><tr><td>90 km/h</td><td class="r num">25 m</td><td class="r num">≈ 81 m</td><td class="r num">≈ 120 m</td></tr><tr><td>110 km/h</td><td class="r num">31 m</td><td class="r num">≈ 121 m</td><td class="r num">≈ 180 m</td></tr></tbody></table><p class="note">Les limitations de vitesse varient selon les pays : renseignez celles de votre réglementation nationale dans vos supports de cours.</p>` },
  { t: 'Le dépassement', h: `<ul><li>On dépasse <b>par la gauche</b>, sauf un véhicule qui a signalé qu’il tourne à gauche.</li><li>Avant : vérifier rétroviseurs et angle mort, signaler avec le clignotant, s’assurer d’avoir la place et la visibilité.</li><li>Laisser un écart latéral suffisant (environ 1 m en agglomération, 1,5 m hors agglomération, davantage pour un deux-roues).</li><li><b>Interdit</b> : ligne continue, virage ou sommet de côte sans visibilité, intersection sans priorité, passage piéton occupé, panneau d’interdiction.</li><li>Le conducteur dépassé ne doit pas accélérer et doit serrer à droite.</li></ul>` },
  { t: 'Arrêt et stationnement', h: `<ul><li><b>Arrêt</b> : immobilisation momentanée, conducteur au volant ou à proximité, pour faire monter ou descendre des personnes ou des marchandises.</li><li><b>Stationnement</b> : immobilisation au-delà de l’arrêt.</li><li>Interdits notamment : sur un passage piéton, un trottoir, à moins de 5 m avant un passage piéton, dans un virage ou au sommet d’une côte, sur un pont, devant une sortie de véhicules, aux arrêts de bus.</li><li>Arrêt et stationnement sont considérés comme dangereux lorsque la visibilité est insuffisante.</li></ul>` },
  { t: 'Marquage au sol', h: `<ul><li><b>Ligne continue</b> : interdit de la franchir ou de la chevaucher.</li><li><b>Ligne discontinue</b> : peut être franchie pour dépasser ou tourner.</li><li><b>Ligne d’annonce</b> (traits longs, espaces courts) : annonce une ligne continue.</li><li><b>Flèches de rabattement</b> : regagnez votre voie, une ligne continue approche.</li><li><b>Ligne d’effet</b> transversale : marque l’endroit où s’arrêter (feu, STOP, cédez le passage).</li><li><b>Zébras</b> : zone où l’on ne doit ni circuler ni s’arrêter.</li><li><b>Bandes blanches parallèles</b> : passage pour piétons.</li></ul>` },
  { t: 'Feux de signalisation', h: `<ul><li><b>Rouge</b> : arrêt absolu à la ligne d’effet.</li><li><b>Orange fixe</b> : arrêt obligatoire, sauf si l’arrêt ne peut se faire en sécurité.</li><li><b>Vert</b> : passage autorisé, sans s’engager si le carrefour est encombré.</li><li><b>Orange clignotant</b> : passer avec prudence, les règles de priorité s’appliquent.</li><li><b>Flèche verte</b> : direction autorisée même si le feu principal est rouge, en cédant le passage aux piétons.</li></ul>` },
  { t: 'Éclairage du véhicule', h: `<ul><li><b>Feux de position</b> : être vu, à l’arrêt ou en agglomération éclairée.</li><li><b>Feux de croisement</b> : de nuit, et de jour par mauvaise visibilité ; ils n’éblouissent pas.</li><li><b>Feux de route</b> : hors agglomération non éclairée ; à remplacer par les feux de croisement dès qu’on croise ou suit un véhicule.</li><li><b>Feux de brouillard</b> : seulement par brouillard ou neige.</li><li><b>Feux de détresse</b> : véhicule en panne, ralentissement brutal, danger.</li></ul>` },
  { t: 'Alcool, médicaments, fatigue, téléphone', h: `<ul><li>L’alcool allonge le temps de réaction, réduit le champ visuel et donne une fausse confiance. Le seul taux sûr est zéro.</li><li>Certains médicaments (pictogramme triangle) et toutes les drogues sont incompatibles avec la conduite.</li><li><b>Fatigue</b> : pause d’au moins 15 minutes toutes les 2 heures ; s’arrêter dès les premiers signes (bâillements, paupières lourdes).</li><li>Le <b>téléphone tenu en main</b> est interdit en conduisant ; même en kit mains libres, l’attention baisse fortement.</li><li><b>Ceinture</b> obligatoire pour tous les occupants, à l’avant comme à l’arrière ; dispositifs adaptés pour les enfants.</li></ul>` },
  { t: 'En cas d’accident : Protéger, Alerter, Secourir', h: `<ol><li><b>Protéger</b> : allumer les feux de détresse, enfiler le gilet, placer le triangle (environ 30 m en amont), faire mettre les passagers en sécurité, couper le contact des véhicules accidentés, ne pas fumer.</li><li><b>Alerter</b> : appeler les secours en donnant le lieu précis, le nombre de victimes et leur état, les dangers particuliers.</li><li><b>Secourir</b> : ne pas déplacer un blessé sauf danger immédiat, ne pas retirer le casque d’un motard, ne rien donner à boire, couvrir et rassurer la victime.</li></ol>` },
  { t: 'Conduite de nuit et par mauvais temps', h: `<ul><li>Pluie : réduire la vitesse, doubler les distances, attention à l’aquaplanage (lâcher l’accélérateur sans freiner brusquement).</li><li>Brouillard : feux de croisement et de brouillard, vitesse réduite, se guider sur le marquage de droite.</li><li>Nuit : nettoyer pare-brise et phares, ne pas fixer les phares en face, regarder le bord droit de la route.</li><li>Vent latéral : tenir fermement le volant, surtout en sortie de tunnel ou en dépassant un poids lourd.</li></ul>` },
  { t: 'Éco-conduite et entretien', h: `<ul><li>Conduite souple : anticiper, éviter les accélérations et freinages brusques.</li><li>Passer les rapports tôt, couper le moteur lors d’un arrêt prolongé.</li><li>Vérifier régulièrement la pression des pneus (à froid), les niveaux (huile, liquide de refroidissement, freins) et l’usure des pneus.</li><li>Retirer les charges inutiles et les galeries de toit vides.</li></ul>` }
];

function enLettres(n) {

  const u = ['', 'un', 'deux', 'trois', 'quatre', 'cinq', 'six', 'sept', 'huit', 'neuf', 'dix', 'onze', 'douze', 'treize', 'quatorze', 'quinze', 'seize', 'dix-sept', 'dix-huit', 'dix-neuf'];
  const d = ['', 'dix', 'vingt', 'trente', 'quarante', 'cinquante', 'soixante', 'soixante', 'quatre-vingt', 'quatre-vingt'];
  const diz = r => { if (r < 20) return u[r]; const di = Math.floor(r / 10), un = r % 10;
    if (di === 7 || di === 9) return d[di] + (di === 7 && un === 1 ? ' et ' : '-') + u[10 + un];
    if (un === 0) return d[di] + (di === 8 ? 's' : '');
    if (un === 1 && di !== 8) return d[di] + ' et un';
    return d[di] + '-' + u[un]; };
  const cent = (x, final) => { let s = ''; const c = Math.floor(x / 100), r = x % 100;
    if (c) { s = c === 1 ? 'cent' : u[c] + ' cent'; if (r === 0 && c > 1 && final) s += 's'; }
    if (r) s += (s ? ' ' : '') + diz(r); return s; };
  const parts = [];
  for (const [v, name] of [[1e9, 'milliard'], [1e6, 'million'], [1e3, 'mille']]) {
    const q = Math.floor(n / v); if (!q) continue;
    if (v === 1e3) parts.push(q === 1 ? 'mille' : cent(q, false) + ' mille');
    else parts.push(cent(q, true) + ' ' + name + (q > 1 ? 's' : ''));
    n %= v;
  }
  if (n) parts.push(cent(n, true));
  return parts.join(' ');
}

async function hashPin(p) {
  const txt = 'autoecole:' + p;
  try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  catch (e) { let h = 5381; for (const ch of txt) h = ((h << 5) + h + ch.charCodeAt(0)) >>> 0; return 'd' + h.toString(16); }
}

function computeAlerts() {
  const t = todayISO(); const out = [];
  S.examens.filter(e => e.date >= t && daysBetween(t, e.date) <= 7).forEach(e => out.push({ lvl: 'info', txt: `Examen ${EXT[e.type] || e.type} (${e.categorie}) le ${fmtDate(e.date, { weekday: 'long', day: 'numeric', month: 'long' })} — ${(e.candidats || []).length} candidat(s)`, act: 'open-ex', id: e.id }));
  S.vehicules.forEach(v => {
    [['assuranceExp', 'Assurance'], ['visiteExp', 'Visite technique']].forEach(([k, l]) => { if (!v[k]) return; const d = daysBetween(t, v[k]);
      if (d < 0) out.push({ lvl: 'bad', txt: `${l} expirée : ${vehLabel(v)} (depuis le ${fmtDate(v[k])})`, act: 'edit-veh', id: v.id });
      else if (d <= 30) out.push({ lvl: 'warn', txt: `${l} de ${vehLabel(v)} expire le ${fmtDate(v[k])}`, act: 'edit-veh', id: v.id }); });
    if (v.vidangeKm && v.km && Number(v.km) >= Number(v.vidangeKm) - 500) out.push({ lvl: Number(v.km) >= Number(v.vidangeKm) ? 'bad' : 'warn', txt: `Vidange à prévoir : ${vehLabel(v)} (${Number(v.km).toLocaleString('fr-FR')} km / ${Number(v.vidangeKm).toLocaleString('fr-FR')} km)`, act: 'edit-veh', id: v.id });
    if (v.statut === 'panne') out.push({ lvl: 'warn', txt: `${vehLabel(v)} est indisponible (en panne)`, act: 'edit-veh', id: v.id });
  });
  S.moniteurs.filter(m => m.actif !== false && m.autorisationExp).forEach(m => { const d = daysBetween(t, m.autorisationExp);
    if (d < 0) out.push({ lvl: 'bad', txt: `Autorisation d’enseigner expirée : ${monName(m)}`, act: 'edit-mon', id: m.id });
    else if (d <= 60) out.push({ lvl: 'warn', txt: `Autorisation d’enseigner de ${monName(m)} expire le ${fmtDate(m.autorisationExp)}`, act: 'edit-mon', id: m.id }); });
  const actifs = S.apprenants.filter(a => !['diplome', 'abandon'].includes(a.statut));
  actifs.filter(a => reste(a) > 0 && a.dateInscription && daysBetween(a.dateInscription, t) > 30 && paye(a) < (Number(a.montantTotal) || 0) / 2).forEach(a => out.push({ lvl: 'warn', txt: `Paiement en retard : ${nomC(a)} a réglé ${money(paye(a))} sur ${money(a.montantTotal)}`, act: 'open-app', id: a.id }));
  const incomplets = actifs.filter(a => docsManquants(a).length);
  if (incomplets.length) out.push({ lvl: 'info', txt: `${incomplets.length} dossier(s) incomplet(s) : pièces manquantes`, act: 'go', id: 'apprenants' });
  const soon = S.seances.filter(s => s.date >= t && s.date <= addDays(t, 7) && conflicts(s).length);
  if (soon.length) out.push({ lvl: 'bad', txt: `${soon.length} séance(s) en conflit dans les 7 prochains jours (même moniteur, véhicule ou apprenant)`, act: 'go', id: 'planning' });
  return out;
}

/* ---- Graphique en barres (SVG) ---- */
function barChart(labels, series, opts = {}) {
  const W = 720, H = opts.h || 230, L = 64, R = 10, Tp = 14, B = 26;
  const max = Math.max(1, ...series.flatMap(s => s.values));
  const nice = (() => { const p = Math.pow(10, Math.floor(Math.log10(max))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= max) return m * p; return 10 * p; })();
  const y = v => Tp + (H - Tp - B) * (1 - v / nice);
  const gw = (W - L - R) / labels.length, bw = Math.min(22, (gw - 8) / series.length);
  const fmt = v => v >= 1e6 ? (v / 1e6).toLocaleString('fr-FR', { maximumFractionDigits: 1 }) + ' M' : v >= 1e3 ? (v / 1e3).toLocaleString('fr-FR', { maximumFractionDigits: 1 }) + ' k' : String(v);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || 'Graphique')}"><g class="grid">`;
  for (let i = 0; i <= 4; i++) { const v = nice * i / 4; s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`; }
  s += '</g>';
  labels.forEach((lb, i) => {
    const x0 = L + i * gw + (gw - bw * series.length) / 2;
    series.forEach((se, k) => { const v = se.values[i] || 0; const h = (H - Tp - B) * v / nice; s += `<rect x="${x0 + k * bw}" y="${y(v)}" width="${bw - 2}" height="${Math.max(0, h)}" rx="3" style="fill:${se.color}"><title>${esc(lb)} — ${esc(se.name)} : ${v.toLocaleString('fr-FR')}</title></rect>`; });
    s += `<text x="${L + i * gw + gw / 2}" y="${H - 8}" text-anchor="middle">${esc(lb)}</text>`;
  });
  return s + '</svg>' + (series.length > 1 ? `<div class="legend">${series.map(se => `<span><i style="background:${se.color}"></i>${esc(se.name)}</span>`).join('')}</div>` : '');
}

  `<div class="kpis">

    <div class="kpi"><span>Séances aujourd’hui</span><b>${sj.filter(s => s.statut !== 'annulee').length}</b><small>${sj.filter(s => s.statut === 'effectuee').length} effectuées</small></div>

  </div>
  ${alerts.length ? `<div class="card"><h3>À traiter (${alerts.length})</h3><div class="alerts">${alerts.slice(0, 12).map(a => `<div class="alert ${a.lvl}"><span>${esc(a.txt)}</span><button class="btn ghost sm" data-act="${a.act}" data-id="${esc(a.id)}">Voir</button></div>`).join('')}</div></div>` : ''}

  const list = S.seances.filter(s => s.date >= days[0] && s.date <= days[6] && (!S.moniteur || s.moniteur === S.moniteur));
  const nb = list.filter(s => s.statut !== 'annulee'); const hC = sum(nb.filter(s => s.type === 'conduite'), s => s.duree);

  return head('Finances', 'Encaissements, dépenses et résultat', `<button class="btn ghost" data-act="csv" data-id="paiements">Exporter les encaissements</button><button class="btn ghost" data-act="csv" data-id="depenses">Exporter les dépenses</button><button class="btn w" data-act="new-dep">Nouvelle dépense</button>`) +
  `<div class="filters">${yearOpts('fin-year', y)}<select id="fin-month" aria-label="Mois">${MOIS.map((n, i) => `<option value="${i}" ${i === m ? 'selected' : ''}>${n}</option>`).join('')}</select></div>

/* ---- Entraînement & examen blanc ---- */
let Q = { etat: 'config', mode: 'mixte', app: '', items: [], i: 0, rep: [], sel: null, end: 0 };
let qTimer = 0;
function buildQuiz(mode) {
  const n = mode === 'examen' ? 40 : 10;
  const signQ = s => { const same = shuffle(SIGNS.filter(x => x.id !== s.id && x.f === s.f)); const other = shuffle(SIGNS.filter(x => x.id !== s.id && x.f !== s.f)); const d = [...same.slice(0, 2), ...other].slice(0, 3); const choix = shuffle([s, ...d]); return { kind: 'sign', q: 'Que signifie ce panneau ?', g: s.g, c: choix.map(x => x.n), b: choix.indexOf(s), e: s.s }; };
  const ruleQ = r => { const ord = shuffle(r.c.map((t, i) => ({ t, i }))); return { kind: 'rule', q: r.q, c: ord.map(o => o.t), b: ord.findIndex(o => o.i === r.b), e: r.e }; };
  const signs = shuffle(SIGNS), rules = shuffle(QREGLES);
  let nS = mode === 'panneaux' ? n : mode === 'regles' ? 0 : Math.ceil(n / 2);
  nS = Math.min(nS, signs.length); let nR = Math.min(n - nS, rules.length); if (nS + nR < n) nS = Math.min(signs.length, n - nR);
  return shuffle([...signs.slice(0, nS).map(signQ), ...rules.slice(0, nR).map(ruleQ)]);
}
function stopTimer() { clearInterval(qTimer); qTimer = 0; }
function finishQuiz() {
  stopTimer(); Q.etat = 'fin';
  const sc = Q.rep.filter((r, i) => r === Q.items[i].b).length;
  if (Q.app && !S.ro) put('quiz', uid(), { apprenantId: Q.app, date: todayISO(), mode: Q.mode, score: sc, total: Q.items.length }).then(() => toast('Score enregistré')).catch(() => {});
  render(); window.scrollTo(0, 0);
}
function tickTimer() {
  const left = Math.max(0, Math.round((Q.end - Date.now()) / 1000)); const el = $('#qz-timer');
  if (el) { el.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`; el.classList.toggle('low', left < 120); }
  if (left <= 0) { toast('Temps écoulé'); finishQuiz(); }
}
function vQuiz() {
  const h = head('Entraînement au code', 'Séries d’entraînement et examen blanc');
  const seuil = Number(cfg().seuilCode) || 35;
  const modeName = m => ({ panneaux: 'Panneaux', regles: 'Règles', mixte: 'Mixte', examen: 'Examen blanc' }[m] || m);
  if (Q.etat === 'config') {
    const apps = S.apprenants.filter(a => !['diplome', 'abandon'].includes(a.statut)).sort(by('nom'));
    const recent = S.quiz.slice().sort((a, b) => String(b.date).localeCompare(String(a.date))).slice(0, 10);
    return h + `<div class="quiz"><div class="qcard"><h3>Nouvelle série</h3>
      <div class="grid2"><label class="f"><span>Type</span><select id="qz-mode"><option value="mixte" ${Q.mode === 'mixte' ? 'selected' : ''}>Entraînement mixte (10 questions)</option><option value="panneaux" ${Q.mode === 'panneaux' ? 'selected' : ''}>Panneaux (10 questions)</option><option value="regles" ${Q.mode === 'regles' ? 'selected' : ''}>Règles (10 questions)</option><option value="examen" ${Q.mode === 'examen' ? 'selected' : ''}>Examen blanc (40 questions, 25 min)</option></select></label>
      <label class="f"><span>Apprenant (pour enregistrer le score)</span><select id="qz-app"><option value="">Entraînement libre (non enregistré)</option>${apps.map(a => `<option value="${a.id}" ${Q.app === a.id ? 'selected' : ''}>${esc(nomC(a))}</option>`).join('')}</select></label></div>
      <p class="note">L’examen blanc se déroule sans correction immédiate ; il est réussi à partir de ${seuil} bonnes réponses sur 40 (seuil modifiable dans les paramètres).</p>
      <div><button class="btn" data-act="qz-start">Commencer</button></div></div>
      <div class="card"><h3>Derniers scores enregistrés</h3><div class="list">${recent.map(r => { const ok = r.total === 40 ? r.score >= seuil : r.score >= 8; return `<div class="li"><div class="t"><b>${esc(nomC(appById(r.apprenantId)))}</b><small>${fmtDate(r.date)} · ${modeName(r.mode)}</small></div><span class="pill ${ok ? 'ok' : r.score / r.total >= .5 ? 'warn' : 'bad'} num">${r.score} / ${r.total}</span></div>`; }).join('') || '<p class="empty">Aucun score enregistré. Choisissez un apprenant avant de lancer une série pour garder son résultat.</p>'}</div></div></div>`;
  }
  if (Q.etat === 'fin') {
    const sc = Q.rep.filter((r, i) => r === Q.items[i].b).length; const N = Q.items.length;
    const verdict = Q.mode === 'examen' ? (sc >= seuil ? `Examen blanc réussi (seuil : ${seuil}/${N}).` : `Examen blanc non réussi : il faut au moins ${seuil}/${N}.`) : (sc >= 9 ? 'Excellent, niveau examen.' : sc >= 7 ? 'Bon résultat, encore un peu de révision.' : 'À retravailler : relisez les leçons puis refaites une série.');
    return h + `<div class="quiz"><div class="qcard"><p class="note">${modeName(Q.mode)} terminé${Q.app ? ' · ' + esc(nomC(appById(Q.app))) : ''}</p><div class="score" style="color:${Q.mode === 'examen' ? (sc >= seuil ? 'var(--ok)' : 'var(--bad)') : 'inherit'}">${sc} / ${N}</div><p>${verdict}</p><div class="qprog">${Q.items.map((it, i) => `<i class="${Q.rep[i] === it.b ? 'ok' : 'ko'}"></i>`).join('')}</div><div class="row"><button class="btn" data-act="qz-again">Nouvelle série</button><a class="btn ghost" href="#code">Revoir les leçons</a></div></div>
    <div class="card"><h3>Correction</h3><div class="list">${Q.items.map((it, i) => `<div class="li"><div class="t"><b>${i + 1}. ${it.kind === 'sign' ? 'Panneau : ' + esc(it.c[it.b]) : esc(it.q)}</b><small>${Q.rep[i] === it.b ? 'Bonne réponse' : (Q.rep[i] == null ? 'Sans réponse' : 'Votre réponse : ' + esc(it.c[Q.rep[i]])) + ' — Bonne réponse : ' + esc(it.c[it.b])}</small></div><span class="pill ${Q.rep[i] === it.b ? 'ok' : 'bad'}">${Q.rep[i] === it.b ? '✓' : '✗'}</span></div>`).join('')}</div></div></div>`;
  }
  const it = Q.items[Q.i]; const ans = Q.rep[Q.i]; const exam = Q.mode === 'examen';
  const prog = Q.items.map((x, i) => `<i class="${exam ? (i < Q.i ? 'cur' : '') : (i < Q.i || (i === Q.i && ans != null) ? (Q.rep[i] === x.b ? 'ok' : 'ko') : i === Q.i ? 'cur' : '')}"></i>`).join('');
  const btnCls = k => exam ? (Q.sel === k ? 'sel' : '') : (ans != null ? (k === it.b ? 'good' : k === ans ? 'bad' : '') : '');
  return h + `<div class="quiz"><div class="row" style="justify-content:space-between"><span class="note">Question ${Q.i + 1} sur ${Q.items.length}</span>${exam ? `<span class="timer" id="qz-timer">--:--</span>` : ''}</div><div class="qprog">${prog}</div>
    <div class="qcard">${it.g ? `<div class="pic">${svg(it.g)}</div>` : ''}<h3 style="font-size:1.3rem">${esc(it.q)}</h3>
    <div class="choices">${it.c.map((c, k) => `<button data-act="qz-ans" data-k="${k}" ${!exam && ans != null ? 'disabled' : ''} class="${btnCls(k)}"><span class="k">${'ABCD'[k]}</span>${esc(c)}</button>`).join('')}</div>
    ${exam ? `<div><button class="btn" data-act="qz-valid" ${Q.sel == null ? 'disabled' : ''}>${Q.i + 1 < Q.items.length ? 'Valider et continuer' : 'Valider et terminer'}</button></div>` :
      ans != null ? `<div class="expl"><b>${ans === it.b ? 'Bonne réponse.' : 'Mauvaise réponse.'}</b> ${esc(it.e)}</div><div><button class="btn" data-act="qz-next">${Q.i + 1 < Q.items.length ? 'Question suivante' : 'Voir le résultat'}</button></div>` : ''}
    </div><div><button class="btn link" data-act="qz-quit">Abandonner</button></div></div>`;
}

    <ul class="steps"><li><b>Windows, Mac, Linux</b> : ouvrez l’application dans Chrome ou Edge, puis cliquez sur l’icône d’installation à droite de la barre d’adresse (ou menu ⋮ › « Installer »). Des installateurs classiques (.exe, .dmg, .AppImage) sont aussi fournis avec la version bureau.</li><li><b>Android</b> : dans Chrome, menu ⋮ › « Installer l’application » ou « Ajouter à l’écran d’accueil ».</li><li><b>iPhone, iPad</b> : dans Safari, bouton Partager › « Sur l’écran d’accueil ».</li></ul>
    ${IN_ARTIFACT ? '<p class="note" style="margin-top:8px">Cette page en ligne est la version partagée. La version installable se trouve dans le dossier du projet fourni avec l’application.</p>' : ''}</div>

  ${ex ? `<div class="card w" style="max-width:820px"><h3>Données d’exemple</h3><p>${ex} élément(s) marqués « exemple » servent à montrer le fonctionnement. Supprimez-les quand vous saisissez vos vraies données.</p><p style="margin-top:10px"><button class="btn danger" data-act="purge-ex">Supprimer les données d’exemple</button></p></div>` : ''}
  <p class="note">${S.mode === 'db' ? 'Les données sont enregistrées en ligne et partagées avec les personnes à qui vous donnez accès.' : 'Les données sont enregistrées sur cet appareil uniquement. Pensez aux sauvegardes.'} Version ${APP_VERSION}.</p>`;
}

/* ============ Dialogues & formulaires ============ */
const dlg = $('#dlg');
function openDlg(html) { $('#dlg-body').innerHTML = html; if (!dlg.open) { try { dlg.showModal(); } catch (e) { dlg.setAttribute('open', ''); } } }
function closeDlg() { try { dlg.close(); } catch (e) { dlg.removeAttribute('open'); } }
dlg.addEventListener('click', e => { if (e.target === dlg) closeDlg(); });
const dhead = t => `<header class="dh"><h2>${t}</h2><button type="button" class="icon" data-act="close" aria-label="Fermer">×</button></header>`;
const inp = (label, name, val, attrs = '', type = 'text') => `<label class="f"><span>${label}</span><input id="i-${name}" name="${name}" type="${type}" value="${esc(val ?? '')}" ${attrs}></label>`;
const sel = (label, name, val, opts, attrs = '') => `<label class="f"><span>${label}</span><select id="i-${name}" name="${name}" ${attrs}>${opts.map(([k, v]) => `<option value="${esc(k)}" ${String(val ?? '') === String(k) ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select></label>`;
const area = (label, name, val) => `<label class="f"><span>${label}</span><textarea id="i-${name}" name="${name}">${esc(val ?? '')}</textarea></label>`;
const fd = form => Object.fromEntries(new FormData(form).entries());
const footer = (delAct, id) => `<footer class="df">${delAct && id ? `<button type="button" class="btn ghost" data-act="${delAct}" data-id="${id}">Supprimer</button>` : ''}<button type="button" class="btn ghost" data-act="close">Annuler</button><button class="btn">Enregistrer</button></footer>`;
let toastT = 0;
function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3400); }

/* ---- Apprenant : formulaire ---- */
function formApprenant(a) {
  const isNew = !a; a = a || { statut: 'inscrit', dateInscription: todayISO(), categorie: (catsSorted().find(c => c.code === 'B') || catsSorted()[0] || {}).code };
  const cats = catsSorted(); let photo = a.photo || '';
  openDlg(`<form id="frm-app" class="form" data-id="${a.id || ''}">${dhead(isNew ? 'Inscrire un apprenant' : 'Modifier l’apprenant')}
    <div class="row">${avatar(a)}<button type="button" class="btn ghost sm" id="btn-photo">${a.photo ? 'Changer la photo' : 'Ajouter une photo'}</button><span class="note">${isNew ? 'N° de dossier attribué automatiquement' : 'Dossier ' + esc(a.dossier || '—')}</span></div>
    <p class="section-title">Identité</p>
    <div class="grid2">${inp('Nom', 'nom', a.nom, 'required autocomplete="off"')}${inp('Prénom(s)', 'prenom', a.prenom, 'required autocomplete="off"')}
    ${sel('Sexe', 'sexe', a.sexe, [['', '—'], ['F', 'Féminin'], ['M', 'Masculin']])}${inp('Date de naissance', 'dateNaissance', a.dateNaissance, '', 'date')}
    ${inp('Lieu de naissance', 'lieuNaissance', a.lieuNaissance)}${inp('Nationalité', 'nationalite', a.nationalite)}
    ${inp('N° pièce d’identité', 'piece', a.piece)}${inp('Profession', 'profession', a.profession)}</div>
    <p class="section-title">Contact</p>
    <div class="grid2">${inp('Téléphone', 'telephone', a.telephone, '', 'tel')}${inp('E-mail', 'email', a.email, '', 'email')}
    ${inp('Adresse', 'adresse', a.adresse)}${inp('Personne à prévenir (nom et téléphone)', 'urgence', a.urgence)}</div>
    <p class="section-title">Formation</p>
    <div class="grid2">${sel('Catégorie de permis', 'categorie', a.categorie, cats.length ? cats.map(c => [c.code, c.code + ' — ' + c.libelle]) : [['', 'Aucune catégorie : ajoutez-en d’abord']])}
    ${sel('Statut', 'statut', a.statut, Object.entries(STATUTS))}
    ${inp('Date d’inscription', 'dateInscription', a.dateInscription, 'required', 'date')}
    ${inp('Coût total de la formation (' + esc(cfg().devise) + ')', 'montantTotal', a.montantTotal, 'min="0" step="any"', 'number')}
    ${inp('N° de livret / dossier préfecture', 'numLivret', a.numLivret)}${inp('Date d’obtention du permis', 'datePermis', a.datePermis, '', 'date')}</div>
    ${area('Notes', 'notes', a.notes)}
    <p class="warn-t" id="age-warn" hidden></p>
    ${footer()}</form>`);
  const f = $('#frm-app');
  $('#btn-photo').onclick = async () => { const file = await pickFile('image/*'); if (!file) return; try { photo = await resizeImage(file, 260); f.querySelector('.avatar').innerHTML = `<img src="${photo}" alt="">`; } catch (e) { toast('Image illisible.'); } };
  const check = () => { const c = catBy(f.categorie.value); const ag = age(f.dateNaissance.value); const w = $('#age-warn');
    if (c && ag != null && c.ageMin && ag < c.ageMin) { w.textContent = `Attention : ${ag} ans, l’âge minimum pour la catégorie ${c.code} est ${c.ageMin} ans.`; w.hidden = false; } else w.hidden = true;
    if (c && c.tarif && !f.montantTotal.value) f.montantTotal.value = c.tarif; };
  f.categorie.addEventListener('change', check); f.dateNaissance.addEventListener('change', check); check();
  f.addEventListener('submit', async e => { e.preventDefault(); const d = fd(f); const id = f.dataset.id || uid(); const old = appById(id) || {};
    const row = { ...old, ...d, nom: d.nom.trim().toUpperCase(), prenom: d.prenom.trim(), montantTotal: Number(d.montantTotal) || 0, paiements: old.paiements || [], photo, dossier: old.dossier || nextDossier() };
    if (!photo) delete row.photo;
    try { await put('apprenants', id, row); toast(isNew ? 'Apprenant inscrit · dossier ' + row.dossier : 'Modifications enregistrées'); S.appTab = 'resume'; openApp(id, row); } catch (e) {} });
}

/* ---- Apprenant : fiche détaillée ---- */
function openApp(id, fallback) {
  const a = appById(id) || (fallback ? { ...fallback, id } : null); if (!a) return;
  const c = catBy(a.categorie); const m = minutesConduite(a); const req = (c && c.heuresConduite) || 0; const pct = req ? Math.min(100, Math.round(100 * m / 60 / req)) : 0;
  const ag = age(a.dateNaissance);
  const tabs = [['resume', 'Résumé'], ['paiements', 'Paiements'], ['livret', 'Livret'], ['seances', 'Séances et examens'], ['dossier', 'Dossier et documents']];
  let body = '';
  if (S.appTab === 'resume') {
    const qz = S.quiz.filter(q => q.apprenantId === a.id).sort((x, y) => String(y.date).localeCompare(String(x.date)));
    body = `<div class="info"><div><span>N° de dossier</span><b>${esc(a.dossier || '—')}</b></div><div><span>Téléphone</span><b>${esc(a.telephone || '—')}</b></div><div><span>Naissance</span><b>${fmtDate(a.dateNaissance)}${ag != null ? ` (${ag} ans)` : ''}</b></div><div><span>Pièce d’identité</span><b>${esc(a.piece || '—')}</b></div><div><span>Adresse</span><b>${esc(a.adresse || '—')}</b></div><div><span>Personne à prévenir</span><b>${esc(a.urgence || '—')}</b></div><div><span>Inscription</span><b>${fmtDate(a.dateInscription)}</b></div>${a.datePermis ? `<div><span>Permis obtenu</span><b>${fmtDate(a.datePermis)}</b></div>` : ''}</div>
    ${a.notes ? `<p class="expl">${esc(a.notes)}</p>` : ''}
    <div class="sect"><h3>Progression</h3>
      <div class="hbar" style="grid-template-columns:120px minmax(0,1fr) 110px"><span>Conduite</span><div class="bar ${pct >= 100 ? 'ok' : ''}"><i style="width:${pct}%"></i></div><b class="num" style="text-align:right">${fmtH(m)}${req ? ' / ' + req + ' h' : ''}</b></div>
      <div class="hbar" style="grid-template-columns:120px minmax(0,1fr) 110px"><span>Code</span><div class="bar"><i style="width:${c && c.heuresCode ? Math.min(100, Math.round(100 * minutesCode(a) / 60 / c.heuresCode)) : 0}%"></i></div><b class="num" style="text-align:right">${fmtH(minutesCode(a))}${c && c.heuresCode ? ' / ' + c.heuresCode + ' h' : ''}</b></div>
      <div class="hbar" style="grid-template-columns:120px minmax(0,1fr) 110px"><span>Compétences</span><div class="bar"><i style="width:${livretPct(a)}%"></i></div><b class="num" style="text-align:right">${livretPct(a)} %</b></div>
      <div class="hbar" style="grid-template-columns:120px minmax(0,1fr) 110px"><span>Paiement</span><div class="bar ok"><i style="width:${a.montantTotal ? Math.min(100, Math.round(100 * paye(a) / a.montantTotal)) : 0}%"></i></div><b class="num" style="text-align:right">${money(paye(a))}</b></div></div>
    ${qz.length ? `<div class="sect"><h3>Scores au code</h3><div class="row">${qz.slice(0, 12).map(q => `<span class="pill ${q.total === 40 ? (q.score >= (Number(cfg().seuilCode) || 35) ? 'ok' : 'bad') : q.score >= 8 ? 'ok' : q.score >= 5 ? 'warn' : 'bad'} num" title="${fmtDate(q.date)}">${q.score}/${q.total}</span>`).join('')}</div></div>` : ''}`;
  } else if (S.appTab === 'paiements') {
    body = `<div class="kpis"><div class="kpi"><span>Coût total</span><b class="num" style="font-size:1.3rem">${money(a.montantTotal)}</b></div><div class="kpi"><span>Payé</span><b class="num" style="font-size:1.3rem">${money(paye(a))}</b></div><div class="kpi"><span>Reste</span><b class="num" style="font-size:1.3rem;color:${reste(a) ? 'var(--warn)' : 'var(--ok)'}">${money(reste(a))}</b></div></div>
    <div class="list">${(a.paiements || []).map((p, i) => `<div class="li"><div class="t"><b class="num">${money(p.montant)}</b><small>${fmtDate(p.date)} · ${esc(p.mode || '')} · ${esc(p.no || '')}${p.motif ? ' · ' + esc(p.motif) : ''}</small></div><div class="row" style="flex-wrap:nowrap"><button class="btn ghost sm" data-act="recu" data-id="${a.id}" data-i="${i}">Reçu</button><button class="btn link sm w" data-act="del-pay" data-id="${a.id}" data-i="${i}">Retirer</button></div></div>`).join('') || '<p class="empty">Aucun paiement enregistré.</p>'}</div>
    <form id="frm-pay" class="payrow w" data-id="${a.id}"><label class="f"><span>Montant</span><input id="p-montant" name="montant" type="number" min="1" step="any" required value="${reste(a) || ''}"></label><label class="f"><span>Date</span><input id="p-date" name="date" type="date" value="${todayISO()}" required></label><label class="f"><span>Mode</span><select id="p-mode" name="mode">${MODES_PAY.map(x => `<option>${x}</option>`).join('')}</select></label><label class="f"><span>Motif</span><input id="p-motif" name="motif" placeholder="Acompte, frais d’examen…"></label><button class="btn">Encaisser</button></form>
    <div class="row"><button class="btn ghost sm" data-act="releve" data-id="${a.id}">Imprimer le relevé de compte</button></div>`;
  } else if (S.appTab === 'livret') {
    const lv = a.livret || {};
    body = `<p class="note">Évaluez chaque compétence au fil des leçons. Progression globale : <b>${livretPct(a)} %</b>.</p><div class="livret">${COMPETENCES.map((g, gi) => `<div><h4>${gi + 1}. ${esc(g.g)}</h4>${g.items.map((it, ii) => { const k = gi + '-' + ii, v = Number(lv[k] || 0); return `<div class="comp"><span>${esc(it)}</span><select id="lv-${k}" class="lv${v}" data-act-change="livret" data-app="${a.id}" data-k="${k}" aria-label="${esc(it)}" ${S.ro ? 'disabled' : ''}>${NIVEAUX.map((n, x) => `<option value="${x}" ${x === v ? 'selected' : ''}>${n}</option>`).join('')}</select></div>`; }).join('')}</div>`).join('')}</div>`;
  } else if (S.appTab === 'seances') {
    const seances = S.seances.filter(s => s.apprenantId === a.id).sort((x, y) => (y.date + y.heure).localeCompare(x.date + x.heure));
    const exams = S.examens.filter(e => (e.candidats || []).some(x => x.id === a.id)).sort(by('date'));
    body = `<div class="sect"><h3>Séances (${seances.length})</h3><div class="list">${seances.slice(0, 30).map(s => `<div class="li"><div class="t"><b>${fmtDate(s.date)} · ${esc(s.heure || '')} · ${s.type === 'code' ? 'Code' : 'Conduite'} (${fmtH(+s.duree || 0)})</b><small>${esc(s.moniteur || '')}${s.notes ? ' · ' + esc(s.notes) : ''}</small></div><span class="pill ${s.statut === 'effectuee' ? 'ok' : s.statut === 'annulee' ? 'bad' : ''}">${SEANCE_ST[s.statut]}</span></div>`).join('') || '<p class="empty">Aucune séance.</p>'}</div><div class="w"><button class="btn ghost sm" data-act="new-seance" data-app="${a.id}">Planifier une séance</button></div></div>
    <div class="sect"><h3>Examens</h3><div class="list">${exams.map(e => { const r = e.candidats.find(x => x.id === a.id).resultat; return `<div class="li"><div class="t"><b>${fmtDate(e.date)} · ${esc(EXT[e.type] || e.type)}</b><small>${esc(e.lieu || '')}</small></div><span class="pill ${RES_CLS[r] || ''}">${RES[r] || r}</span></div>`; }).join('') || '<p class="empty">Pas encore inscrit à un examen.</p>'}</div></div>`;
  } else {
    const dc = a.docs || {};
    body = `<div class="sect"><h3>Pièces du dossier</h3><div class="docs">${DOCS.map((d, i) => `<label><input type="checkbox" id="doc-${i}" data-act-change="doc" data-app="${a.id}" data-i="${i}" ${dc[i] ? 'checked' : ''} ${S.ro ? 'disabled' : ''}> ${esc(d)}</label>`).join('')}</div></div>
    <div class="sect"><h3>Documents à imprimer</h3><div class="row"><button class="btn ghost" data-act="fiche" data-id="${a.id}">Fiche d’inscription</button><button class="btn ghost" data-act="contrat" data-id="${a.id}">Contrat de formation</button><button class="btn ghost" data-act="attestation" data-id="${a.id}">Attestation de formation</button><button class="btn ghost" data-act="releve" data-id="${a.id}">Relevé de compte</button></div>
    <p class="note">${IN_ARTIFACT ? 'Ici, chaque document est téléchargé en fichier .html qui s’imprime à l’ouverture.' : 'Le document s’ouvre dans la fenêtre d’impression : choisissez votre imprimante ou « Enregistrer en PDF ».'}</p></div>`;
  }
  openDlg(`${dhead(esc(nomC(a)))}
    <div class="row">${avatar(a)}<div style="display:grid;gap:6px"><div class="row">${statutPill(a.statut)}<span class="catbadge">${esc(a.categorie || '?')}</span>${c ? `<span class="note">${esc(c.libelle)}</span>` : ''}${exPill(a)}</div><span class="note">Dossier ${esc(a.dossier || '—')}</span></div></div>
    <div class="dtabs" role="group" aria-label="Sections de la fiche">${tabs.map(([k, l]) => `<button data-act="apptab" data-v="${k}" data-id="${a.id}" aria-pressed="${S.appTab === k}">${l}</button>`).join('')}</div>
    ${body}
    <footer class="df w"><button class="btn ghost" data-act="del-app" data-id="${a.id}">Supprimer le dossier</button><button class="btn" data-act="edit-app" data-id="${a.id}">Modifier</button></footer>`);
  const pf = $('#frm-pay');
  if (pf) pf.addEventListener('submit', async e => { e.preventDefault(); const d = fd(pf); const cur = appById(a.id) || a;
    const p = { montant: Number(d.montant), date: d.date, mode: d.mode, motif: d.motif.trim(), no: nextRecu() };
    const row = { ...cur, paiements: [...(cur.paiements || []), p] };
    try { await put('apprenants', a.id, row); toast('Paiement enregistré · reçu ' + p.no); openApp(a.id, row); } catch (e) {} });
}

/* ---- Documents imprimables ---- */
function docRecu(a, i) {
  const p = (a.paiements || [])[i]; if (!p) return; const c = cfg();
  const avant = sum((a.paiements || []).slice(0, i), x => x.montant);
  printDoc('Reçu ' + (p.no || ''), docHead('Reçu de paiement', `N° ${esc(p.no || '—')}<br>Le ${fmtLong(p.date)}`) +
    `<table><tr><th style="width:35%">Reçu de</th><td><b>${esc(nomC(a))}</b> — dossier ${esc(a.dossier || '—')}</td></tr><tr><th>Formation</th><td>Permis ${esc(a.categorie || '')} ${catBy(a.categorie) ? '— ' + esc(catBy(a.categorie).libelle) : ''}</td></tr><tr><th>Motif</th><td>${esc(p.motif || 'Frais de formation')}</td></tr><tr><th>Mode de paiement</th><td>${esc(p.mode || '')}</td></tr><tr><th>Montant</th><td class="big">${money(p.montant)}</td></tr><tr><th>Arrêté à la somme de</th><td><i>${esc(enLettres(p.montant))} ${esc(c.devise || '')}</i></td></tr></table>
    <h2>Situation du compte</h2><table><tr><th>Coût total de la formation</th><th>Déjà versé avant ce reçu</th><th>Ce versement</th><th>Reste à payer</th></tr><tr><td>${money(a.montantTotal)}</td><td>${money(avant)}</td><td>${money(p.montant)}</td><td><b>${money(Math.max(0, (a.montantTotal || 0) - avant - p.montant))}</b></td></tr></table>
    <div class="sign"><div>Signature de l’apprenant</div><div>Pour ${esc(c.nom)}${c.directeur ? '<br>' + esc(c.directeur) : ''}</div></div>`);
}
function docFiche(a) {
  const c = catBy(a.categorie);
  printDoc('Fiche inscription ' + nomC(a), docHead('Fiche d’inscription', `Dossier ${esc(a.dossier || '—')}<br>Inscrit le ${fmtLong(a.dateInscription)}`) +
    `<div style="display:flex;gap:18px;align-items:flex-start">${a.photo ? `<img src="${esc(a.photo)}" style="width:110px;height:140px;object-fit:cover;border:1px solid #999">` : '<div style="width:110px;height:140px;border:1px dashed #999;display:grid;place-items:center;font-size:9pt;color:#666">Photo</div>'}
    <table style="flex:1"><tr><th>Nom</th><td><b>${esc(a.nom || '')}</b></td><th>Prénom(s)</th><td>${esc(a.prenom || '')}</td></tr><tr><th>Né(e) le</th><td>${fmtDate(a.dateNaissance)}</td><th>À</th><td>${esc(a.lieuNaissance || '')}</td></tr><tr><th>Sexe</th><td>${esc(a.sexe || '')}</td><th>Nationalité</th><td>${esc(a.nationalite || '')}</td></tr><tr><th>Pièce d’identité</th><td>${esc(a.piece || '')}</td><th>Profession</th><td>${esc(a.profession || '')}</td></tr><tr><th>Téléphone</th><td>${esc(a.telephone || '')}</td><th>E-mail</th><td>${esc(a.email || '')}</td></tr><tr><th>Adresse</th><td colspan="3">${esc(a.adresse || '')}</td></tr><tr><th>Personne à prévenir</th><td colspan="3">${esc(a.urgence || '')}</td></tr></table></div>
    <h2>Formation choisie</h2><table><tr><th>Catégorie</th><td><b>${esc(a.categorie || '')}</b> — ${esc(c ? c.libelle : '')}</td></tr><tr><th>Volume prévu</th><td>${c ? `${c.heuresCode} h de code, ${c.heuresConduite} h de conduite` : ''}</td></tr><tr><th>Coût de la formation</th><td>${money(a.montantTotal)}</td></tr></table>
    <h2>Pièces fournies</h2><table>${DOCS.map((d, i) => `<tr><td style="width:30px;text-align:center">${(a.docs || {})[i] ? '☑' : '☐'}</td><td>${esc(d)}</td></tr>`).join('')}</table>
    <p class="small">Je soussigné(e) certifie l’exactitude des renseignements ci-dessus et déclare avoir pris connaissance du règlement intérieur de l’établissement.</p>
    <div class="sign"><div>Date et signature de l’apprenant</div><div>Cachet et signature de l’auto-école</div></div>`);
}
function docContrat(a) {
  const c = catBy(a.categorie), k = cfg();
  printDoc('Contrat ' + nomC(a), docHead('Contrat de formation', `Dossier ${esc(a.dossier || '—')}`) +
    `<p>Entre <b>${esc(k.nom)}</b>${k.agrement ? ', agrément n° ' + esc(k.agrement) : ''}, ${esc([k.adresse, k.ville].filter(Boolean).join(', '))}, ci-après « l’établissement »,</p><p>et <b>${esc(nomC(a))}</b>, né(e) le ${fmtDate(a.dateNaissance)}, pièce d’identité n° ${esc(a.piece || '…')}, ci-après « l’élève »,</p><p>il est convenu ce qui suit.</p>
    <h2>Article 1 — Objet</h2><p>L’établissement s’engage à dispenser à l’élève la formation théorique et pratique préparant au permis de conduire de catégorie <b>${esc(a.categorie || '')}</b>${c ? ' (' + esc(c.libelle) + ')' : ''}.</p>

  const f = $('#frm-se');

    $('#ex-cands').innerHTML = list.map(a => `<label><input type="checkbox" value="${a.id}" ${chosen.has(a.id) ? 'checked' : ''}> ${esc(nomC(a))} <span class="note">· ${esc(STATUTS[a.statut] || '')}${reste(a) ? ' · reste ' + money(reste(a)) : ''}</span></label>`).join('') || '<p class="empty">Aucun apprenant en formation dans cette catégorie.</p>'; };
  f.categorie.addEventListener('change', fill); fill();
  f.addEventListener('submit', async ev => { ev.preventDefault(); const d = fd(f); const id = f.dataset.id || uid(); const old = S.examens.find(x => x.id === id) || {};
    const ids = [...f.querySelectorAll('#ex-cands input:checked')].map(i => i.value);
    const prev = Object.fromEntries((old.candidats || []).map(c => [c.id, c.resultat]));
    const row = { ...old, ...d, frais: Number(d.frais) || 0, candidats: ids.map(i => ({ id: i, resultat: prev[i] || 'attente' })) };
    try {

    } catch (e) {} });
